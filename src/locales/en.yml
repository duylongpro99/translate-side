  noTranslation: no translation came back
  noBasicMissing: There is no built-in translator here, so there is no basic translation either.
  noBasicPair: $1 can't translate $2 → $3 on this device, so there is no basic translation either.
  withNoBasic: $1. $2
  budget: skipped, the budget for this page ran out
  stopped: the translation stopped unexpectedly
  quota: no allowance left on this key ($1)
  busy: the provider is busy; try again in a moment
  network: network error
  contextLength: too long for the model
  modelNotFound: model not found ($1)
  unknown: unknown error
