      recoveredNoBasic: $1 $2 for a while; $3 could not translate the blocks in between, and $1 $4.
      basicNoHelp: $1 $2 and no other model answered; $3 could not translate the page either.
      basicContinuing: $1 $2 and no other model answered; continuing with $3. Its blocks are marked “basic translation”.
      basicContinued: $1 $2 and no other model answered; continued with $3. Its blocks are marked “basic translation”.
      continuing: $1 $2; continuing with $3. Blocks it translated are marked.
      continued: $1 $2; continued with $3. Blocks it translated are marked.

errors:
  auth: Key invalid or missing
  authCharacters: Key has characters that can't be sent
  noKey: Add your $1 API key in settings
  noProtocol: $1 has no protocol yet. Test the connection in settings.
