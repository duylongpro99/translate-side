      detected: language detection on this device
    backoff:
      rateLimit: Rate limited
      network: Connection problem
      busy: Provider busy
      soon: retrying shortly
      in: retrying in $1 s
      part: part $1
      attempt: (attempt $1)
    why:
      rateLimit: is rate limited
      network: is unreachable
      overloaded: is overloaded
    whyPast:
      rateLimit: was rate limited
      network: was unreachable
      overloaded: was overloaded
