    fallback: ", and if it is busy or down, {list}"
    then: ", then"
    never: Mail and sign-in pages, browser pages and the Chrome Web Store are never read or sent.
    fields: Password and other form fields, and anything you can type into, are never read. A page with a password field in use is skipped.
    local: For sensitive pages, don't translate them with a cloud provider. A local model on this computer (Ollama or LM Studio, set up in Providers) keeps the text on this device.
    diagnostics: A diagnostics log of recent translations (counts, timings, error kinds; no page text) is kept on this device. It leaves only if you export it in Settings.
    ok: Got it, translate
